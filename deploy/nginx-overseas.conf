server {
    listen 80;
    server_name jimmyluojun.com www.jimmyluojun.com;

    root /var/www/jimmyluojun.com;
    index index.html;

    access_log /var/log/nginx/jimmyluojun.access.log;
    error_log /var/log/nginx/jimmyluojun.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jsx|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
}

